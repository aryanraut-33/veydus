# ─────────────────────────────────────────────────────────────────
# VEYDUS — Alembic Configuration
# ─────────────────────────────────────────────────────────────────
# What:  Configures Alembic for PostgreSQL schema migrations.
# How:   Points at the alembic/ directory for migration scripts,
#        and reads the database URL from the VEYDUS_MIGRATE_DB_URL
#        environment variable (falling back to local dev default).
# Usage: alembic upgrade head    — apply all migrations
#        alembic downgrade -1    — roll back one migration
#        alembic revision -m "description" — create a new migration
# Note:  Migrations run as veydus_migrate (table owner, BYPASSRLS).
#        The application runtime uses veydus_app (subject to RLS).
# ─────────────────────────────────────────────────────────────────

[alembic]
script_location = %(here)s/alembic
# Default URL for local development. Override via VEYDUS_MIGRATE_DB_URL env var.
sqlalchemy.url = postgresql+psycopg2://veydus_migrate:veydus_migrate_pw@localhost:5432/veydus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
