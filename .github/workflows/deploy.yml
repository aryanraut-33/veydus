# ==============================================================================
# FILE: .github/workflows/deploy.yml
# WHAT: Continuous Deployment (CD) pipeline with mandatory blocking isolation test gate.
# HOW: Uses GitHub Actions to run isolation/security tests against an ephemeral PostgreSQL
#      container, build multi-stage Docker images, push to Google Artifact Registry,
#      execute VPC-internal Alembic database migrations via Cloud Run Jobs, and deploy
#      veydus-api and veydus-worker services to Cloud Run.
# WHY: HLD §16 & §18.1 mandate zero deployment without verified tenant isolation tests;
#      prevents multi-tenant data leaks and ensures zero-downtime database schema migration.
# TOOLS/LIBRARIES: GitHub Actions, Docker, Google Cloud SDK, Pytest, Pgvector.
# ==============================================================================

name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment"
        required: true
        default: "production"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-south1' }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY || 'veydus' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: MANDATORY BLOCKING SECURITY & ISOLATION GATE (HLD §16)
  # ────────────────────────────────────────────────────────────────────────────
  isolation-gate:
    name: Blocking Isolation & Security Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: veydus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: veydus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Anti-Defect Scope Verification (No JWT Scope Claims)
        run: |
          pytest backend/tests/unit/test_no_scope_from_jwt_claims.py -v

      - name: Run Cloud Tasks OIDC Verification Tests
        run: |
          pytest backend/tests/unit/test_cloud_tasks_oidc.py -v

      - name: Run Tenant Isolation & Verifiable Deletion Gate
        run: |
          pytest backend/tests/integration/test_tenant_isolation.py backend/tests/integration/test_deletion_guarantee.py -v

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: BUILD & PUSH CONTAINER IMAGES TO ARTIFACT REGISTRY
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: isolation-gate
    if: success()
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set Image URIs
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          echo "API_IMAGE=${REGISTRY}/api:${{ github.sha }}" >> $GITHUB_ENV
          echo "WORKER_IMAGE=${REGISTRY}/worker:${{ github.sha }}" >> $GITHUB_ENV
          echo "JOBS_IMAGE=${REGISTRY}/jobs:${{ github.sha }}" >> $GITHUB_ENV
          echo "API_LATEST=${REGISTRY}/api:latest" >> $GITHUB_ENV
          echo "WORKER_LATEST=${REGISTRY}/worker:latest" >> $GITHUB_ENV
          echo "JOBS_LATEST=${REGISTRY}/jobs:latest" >> $GITHUB_ENV

      - name: Build and Push API Container
        run: |
          docker build \
            -f backend/docker/Dockerfile.api \
            -t ${{ env.API_IMAGE }} \
            -t ${{ env.API_LATEST }} \
            backend
          docker push ${{ env.API_IMAGE }}
          docker push ${{ env.API_LATEST }}

      - name: Build and Push Worker Container
        run: |
          docker build \
            -f backend/docker/Dockerfile.worker \
            -t ${{ env.WORKER_IMAGE }} \
            -t ${{ env.WORKER_LATEST }} \
            backend
          docker push ${{ env.WORKER_IMAGE }}
          docker push ${{ env.WORKER_LATEST }}

      - name: Build and Push Jobs Container (Migrations & Admin)
        run: |
          docker build \
            -f backend/docker/Dockerfile.jobs \
            -t ${{ env.JOBS_IMAGE }} \
            -t ${{ env.JOBS_LATEST }} \
            backend
          docker push ${{ env.JOBS_IMAGE }}
          docker push ${{ env.JOBS_LATEST }}

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 3: VPC-INTERNAL DATABASE MIGRATION & DEPLOYMENT
  # ────────────────────────────────────────────────────────────────────────────
  deploy-cloud-run:
    name: Run Migrations & Deploy Services
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update Migration Job Image & Execute
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          # Update the Cloud Run Job image to current SHA
          gcloud run jobs update veydus-migration-job \
            --image "${REGISTRY}/jobs:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"
          # Execute the migration job inside VPC and block until completion
          echo "Executing Alembic database migrations inside VPC..."
          gcloud run jobs execute veydus-migration-job \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --wait

      - name: Deploy veydus-api to Cloud Run
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          gcloud run deploy veydus-api \
            --image "${REGISTRY}/api:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"

      - name: Deploy veydus-worker to Cloud Run
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}"
          gcloud run deploy veydus-worker \
            --image "${REGISTRY}/worker:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}"
